name: Quality checks
on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-checks:
    name: Lint, Typecheck & Media
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run media:check
      - run: npm audit --omit=dev --audit-level=high

  unit-tests:
    name: Unit & Component Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand

  integration-and-e2e:
    name: Integration, Build & E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://mms:mms@localhost:5432/mms_test
      MMS_TEST_DATABASE_URL: postgresql://mms:mms@localhost:5432/mms_test
      PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mms
          POSTGRES_PASSWORD: mms
          POSTGRES_DB: mms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:deploy
      - run: npm run content:import -- --apply
      - run: npm run test:integration
      - run: node --conditions=react-server scripts/verify-lead-recovery.cjs --confirm-test-records
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results
          retention-days: 7
          if-no-files-found: ignore

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [static-checks, unit-tests, integration-and-e2e]
    if: always()
    steps:
      - name: Verify all quality jobs succeeded
        run: |
          if [ "${{ needs.static-checks.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.integration-and-e2e.result }}" != "success" ]; then
            echo "One or more quality checks failed:"
            echo "  static-checks: ${{ needs.static-checks.result }}"
            echo "  unit-tests: ${{ needs.unit-tests.result }}"
            echo "  integration-and-e2e: ${{ needs.integration-and-e2e.result }}"
            exit 1
          fi
